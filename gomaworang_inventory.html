<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고마워랑 재고관리</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c5f8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="재고관리">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --border: #e8e4dc;
    --text: #1a1a18;
    --muted: #7a7870;
    --empty: #e8453c;
    --danger: #f07b2a;
    --warning: #e8b84b;
    --safe: #4caf7d;
    --accent: #2c5f8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .logo span {
    font-weight: 300;
    color: var(--muted);
    font-size: 13px;
    margin-left: 8px;
  }

  .header-right {
    font-size: 12px;
    color: var(--muted);
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 20px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .stat-card.active { border-color: currentColor; }

  .stat-card .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-card .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .stat-card .number {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-card .sub { font-size: 12px; color: var(--muted); }

  .stat-card.c-empty { color: var(--empty); }
  .stat-card.c-danger { color: var(--danger); }
  .stat-card.c-warning { color: var(--warning); }
  .stat-card.c-safe { color: var(--safe); }

  .controls {
    padding: 0 24px 16px;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 16px 10px 38px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus { border-color: var(--accent); }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }

  .sort-select {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  .result-count {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .table-wrap {
    padding: 0 24px 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    font-size: 13px;
  }

  thead tr {
    background: #f9f8f5;
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf9f7; }

  td {
    padding: 12px 16px;
    vertical-align: middle;
  }

  .product-name {
    max-width: 320px;
    font-weight: 500;
    font-size: 13px;
    line-height: 1.4;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-empty { background: #ffeeed; color: var(--empty); }
  .badge-danger { background: #fff3ec; color: var(--danger); }
  .badge-warning { background: #fdf8ec; color: #b8851a; }
  .badge-safe { background: #edf7f2; color: #2e8a58; }

  .stock-total {
    font-weight: 700;
    font-size: 15px;
  }

  .stock-total.empty { color: var(--empty); }
  .stock-total.danger { color: var(--danger); }
  .stock-total.warning { color: #b8851a; }
  .stock-total.safe { color: #2e8a58; }

  .size-inputs {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .size-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .size-label {
    font-size: 9px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .size-input {
    width: 52px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: var(--text);
    background: #faf9f7;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .size-input:focus {
    border-color: var(--accent);
    background: white;
  }

  .price {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .status-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }

  .status-selling { background: #edf7f2; color: #2e8a58; }
  .status-soldout { background: #ffeeed; color: var(--empty); }
  .status-stop { background: #f5f3ef; color: var(--muted); }

  .save-btn {
    padding: 6px 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .save-btn:hover { opacity: 0.85; }
  .save-btn.saved { background: var(--safe); }

  .notice-bar {
    background: #fff8e6;
    border: 1px solid #f0d070;
    border-radius: 8px;
    padding: 10px 16px;
    margin: 0 24px 16px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
    font-size: 12px;
    color: #7a6010;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .filter-tabs {
    display: flex;
    gap: 4px;
  }

  .filter-tab {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: var(--card);
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

  @media (max-width: 768px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .product-name { max-width: 160px; font-size: 12px; }
    .size-inputs { flex-direction: column; gap: 3px; }
    .size-input { width: 46px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">고마워랑 재고관리 <span>Inventory Dashboard</span></div>
  <div class="header-right" id="lastSaved">저장되지 않음</div>
</header>

<div class="summary" id="summary"></div>

<div style="padding: 0 24px 12px; max-width:1200px; margin:0 auto;">
  <div class="notice-bar">
    ⚠️ 합계 재고는 스마트스토어에서 자동으로 가져온 값이에요. 사이즈별 재고는 직접 입력 후 저장하세요. 브라우저를 닫아도 유지돼요.
  </div>
</div>

<div class="controls">
  <div class="search-box">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="상품명 검색..." oninput="render()">
  </div>
  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" onclick="setFilter('all', this)">전체</button>
    <button class="filter-tab" onclick="setFilter('empty', this)" style="color:var(--empty)">품절</button>
    <button class="filter-tab" onclick="setFilter('danger', this)" style="color:var(--danger)">위험(1~3)</button>
    <button class="filter-tab" onclick="setFilter('warning', this)" style="color:#b8851a">주의(4~6)</button>
    <button class="filter-tab" onclick="setFilter('safe', this)" style="color:var(--safe)">안전(7+)</button>
  </div>
  <select class="sort-select" id="sortSelect" onchange="render()">
    <option value="stock_asc">재고 적은순</option>
    <option value="stock_desc">재고 많은순</option>
    <option value="name_asc">상품명순</option>
    <option value="date_desc">최신등록순</option>
  </select>
  <span class="result-count" id="resultCount"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:40px">#</th>
        <th>상품명</th>
        <th>합계재고</th>
        <th>30×40</th>
        <th>40×60</th>
        <th>50×70</th>
        <th>판매가</th>
        <th>상태</th>
        <th>저장</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none">검색 결과가 없어요 😅</div>
</div>

// 품절/판매금지 제외한 실제 관리 대상만
const PRODUCTS = RAW.filter(p => !['판매중지','판매금지'].includes(p.status));

let currentFilter = 'all';
let sizeData = {};

function loadSizeData() {
  try {
    const saved = localStorage.getItem('gomaworang_sizes');
    if (saved) sizeData = JSON.parse(saved);
  } catch(e) {}
}

function saveSizeData(idx, field, val) {
  if (!sizeData[idx]) sizeData[idx] = {s3040:0, s4060:0, s5070:0};
  sizeData[idx][field] = parseInt(val) || 0;
  localStorage.setItem('gomaworang_sizes', JSON.stringify(sizeData));
  const now = new Date().toLocaleString('ko-KR');
  document.getElementById('lastSaved').textContent = '저장됨 ' + now;
  const btn = document.getElementById('btn_' + idx);
  if (btn) {
    btn.textContent = '저장됨';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '저장'; btn.classList.remove('saved'); }, 1500);
  }
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getLevelLabel(level) {
  const map = { empty: '품절', danger: '위험', warning: '주의', safe: '안전' };
  return map[level] || level;
}

function getStatusClass(status) {
  if (status === '판매중') return 'status-selling';
  if (status === '품절') return 'status-soldout';
  return 'status-stop';
}

function renderSummary() {
  const counts = { empty:0, danger:0, warning:0, safe:0 };
  PRODUCTS.forEach(p => counts[p.level]++);
  document.getElementById('summary').innerHTML = `
    <div class="stat-card c-empty" onclick="setFilter('empty', document.querySelectorAll('.filter-tab')[1])">
      <div class="label"><span class="dot" style="background:var(--empty)"></span>품절</div>
      <div class="number">${counts.empty}</div>
      <div class="sub">즉시 재입고 필요</div>
    </div>
    <div class="stat-card c-danger" onclick="setFilter('danger', document.querySelectorAll('.filter-tab')[2])">
      <div class="label"><span class="dot" style="background:var(--danger)"></span>위험 (1~3개)</div>
      <div class="number">${counts.danger}</div>
      <div class="sub">곧 품절 예정</div>
    </div>
    <div class="stat-card c-warning" onclick="setFilter('warning', document.querySelectorAll('.filter-tab')[3])">
      <div class="label"><span class="dot" style="background:var(--warning)"></span>주의 (4~6개)</div>
      <div class="number">${counts.warning}</div>
      <div class="sub">재입고 준비 필요</div>
    </div>
    <div class="stat-card c-safe" onclick="setFilter('safe', document.querySelectorAll('.filter-tab')[4])">
      <div class="label"><span class="dot" style="background:var(--safe)"></span>안전 (7개+)</div>
      <div class="number">${counts.safe}</div>
      <div class="sub">여유 있음</div>
    </div>
  `;
}

function render() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let filtered = PRODUCTS.filter(p => {
    const matchSearch = !query || p.name.toLowerCase().includes(query);
    const matchFilter = currentFilter === 'all' || p.level === currentFilter;
    return matchSearch && matchFilter;
  });

  filtered.sort((a, b) => {
    if (sort === 'stock_asc') return a.stock - b.stock;
    if (sort === 'stock_desc') return b.stock - a.stock;
    if (sort === 'name_asc') return a.name.localeCompare(b.name, 'ko');
    if (sort === 'date_desc') return new Date(b.registered) - new Date(a.registered);
    return 0;
  });

  document.getElementById('resultCount').textContent = `${filtered.length}개 상품`;

  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const originalIndexMap = new Map(PRODUCTS.map((p, i) => [p.name, i]));

  tbody.innerHTML = filtered.map((p, i) => {
    const idx = originalIndexMap.get(p.name);
    const sd = sizeData[idx] || {s3040:0, s4060:0, s5070:0};
    const price = parseInt(p.price).toLocaleString();
    return `
      <tr>
        <td style="color:var(--muted);font-size:12px">${i+1}</td>
        <td><div class="product-name">${p.name}</div></td>
        <td>
          <span class="stock-total ${p.level}">${p.stock}</span>
          <span class="badge badge-${p.level}" style="margin-left:6px">${getLevelLabel(p.level)}</span>
        </td>
        <td>
          <div class="size-group">
            <span class="size-label">30×40</span>
            <input class="size-input" type="number" min="0" value="${sd.s3040}"
              onchange="saveSizeData(${idx},'s3040',this.value)" id="s3040_${idx}">
          </div>
        </td>
        <td>
          <div class="size-group">
            <span class="size-label">40×60</span>
            <input class="size-input" type="number" min="0" value="${sd.s4060}"
              onchange="saveSizeData(${idx},'s4060',this.value)" id="s4060_${idx}">
          </div>
        </td>
        <td>
          <div class="size-group">
            <span class="size-label">50×70</span>
            <input class="size-input" type="number" min="0" value="${sd.s5070}"
              onchange="saveSizeData(${idx},'s5070',this.value)" id="s5070_${idx}">
          </div>
        </td>
        <td class="price">₩${price}</td>
        <td><span class="status-badge ${getStatusClass(p.status)}">${p.status}</span></td>
        <td><button class="save-btn" id="btn_${idx}"
          onclick="saveSizeData(${idx},'s3040',document.getElementById('s3040_${idx}').value);saveSizeData(${idx},'s4060',document.getElementById('s4060_${idx}').value);saveSizeData(${idx},'s5070',document.getElementById('s5070_${idx}').value)">저장</button></td>
      </tr>
    `;
  }).join('');
}

loadSizeData();
renderSummary();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('SW 등록 완료'))
      .catch(e => console.log('SW 등록 실패', e));
  });
}
</script>
</body>
</html>
